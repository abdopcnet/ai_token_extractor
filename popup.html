<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      width: 340px;
      min-height: 180px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1e1e2e;
      color: #cdd6f4;
      padding: 16px;
    }
    h2 {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 12px;
      color: #f5f5f5;
      border-bottom: 1px solid #313244;
      padding-bottom: 10px;
    }
    .field {
      margin-bottom: 12px;
    }
    .field-label {
      font-size: 12px;
      font-weight: 500;
      color: #a6adc8;
      margin-bottom: 4px;
      display: block;
    }
    .field-value {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #313244;
      border-radius: 6px;
      background: #28283a;
      color: #cdd6f4;
      font-size: 13px;
    }
    .field-value.provider {
      font-weight: 600;
      color: #89b4fa;
    }
    .field-value.token {
      font-family: 'Monaco', 'Menlo', monospace;
      font-size: 11px;
      background: #1a1a2e;
      border-color: #45475a;
      color: #a6adc8;
      min-height: 72px;
      resize: vertical;
      line-height: 1.4;
    }
    .field-value:disabled {
      opacity: 1;
    }
    .btn {
      margin-top: 4px;
      padding: 8px;
      border: none;
      border-radius: 6px;
      background: #89b4fa;
      color: #1e1e2e;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
    }
    .btn:hover {
      background: #74a7e8;
    }
    .btn-row {
      display: flex;
      gap: 8px;
    }
    .btn-row .btn {
      flex: 1;
    }
    .btn-secondary {
      background: #45475a;
      color: #cdd6f4;
    }
    .btn-secondary:hover {
      background: #585b70;
    }
    .status {
      margin-top: 8px;
      font-size: 12px;
      color: #a6adc8;
      padding: 6px 8px;
      border-radius: 4px;
      background: #28283a;
      display: none;
    }
    .status.success { display: block; color: #a6e3a1; border-left: 3px solid #a6e3a1; }
    .status.error { display: block; color: #f38ba8; border-left: 3px solid #f38ba8; }
    .status.info { display: block; color: #89b4fa; border-left: 3px solid #89b4fa; }
    .host-hint {
      font-size: 11px;
      color: #6c7086;
      margin-top: 2px;
    }
  </style>
</head>
<body>
  <h2>🔑 Token Extractor</h2>

  <div class="field">
    <label class="field-label">Provider</label>
    <input type="text" id="providerDisplay" class="field-value provider" readonly value="Detecting..." />
    <div id="hostHint" class="host-hint"></div>
  </div>

  <div class="field">
    <label class="field-label">Token</label>
    <textarea id="tokenInput" class="field-value token" readonly placeholder="Analyzing active tab..."></textarea>
  </div>

  <div class="btn-row">
    <button class="btn" id="copyBtn">📋 Copy</button>
    <button class="btn btn-secondary" id="refreshBtn">🔄 Refresh</button>
  </div>

  <div id="status" class="status"></div>

  <script src="popup.js"></script>
</body>
</html>

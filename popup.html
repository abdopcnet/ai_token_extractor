<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      width: 320px;
      min-height: 200px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1e1e2e;
      color: #cdd6f4;
      padding: 16px;
    }
    h2 {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 12px;
      color: #f5f5f5;
      border-bottom: 1px solid #313244;
      padding-bottom: 10px;
    }
    .provider-group {
      margin-bottom: 12px;
    }
    .provider-label {
      font-size: 12px;
      font-weight: 500;
      color: #a6adc8;
      margin-bottom: 4px;
      display: block;
    }
    select, input, button {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #313244;
      border-radius: 6px;
      background: #28283a;
      color: #cdd6f4;
      font-size: 13px;
      outline: none;
      transition: border-color 0.2s;
    }
    select:focus, input:focus {
      border-color: #89b4fa;
    }
    select {
      cursor: pointer;
    }
    select option {
      background: #28283a;
      color: #cdd6f4;
    }
    .token-display {
      margin-top: 8px;
    }
    .token-display input {
      font-family: 'Monaco', 'Menlo', monospace;
      font-size: 11px;
      background: #1a1a2e;
      border-color: #45475a;
      color: #a6adc8;
      word-break: break-all;
    }
    .token-display input:focus {
      border-color: #89b4fa;
    }
    .btn {
      margin-top: 10px;
      padding: 8px;
      border: none;
      border-radius: 6px;
      background: #89b4fa;
      color: #1e1e2e;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn:hover {
      background: #74a7e8;
    }
    .btn-secondary {
      background: #45475a;
      color: #cdd6f4;
    }
    .btn-secondary:hover {
      background: #585b70;
    }
    .status {
      margin-top: 8px;
      font-size: 12px;
      color: #a6adc8;
      padding: 6px 8px;
      border-radius: 4px;
      background: #28283a;
      display: none;
    }
    .status.success {
      display: block;
      color: #a6e3a1;
      border-left: 3px solid #a6e3a1;
    }
    .status.error {
      display: block;
      color: #f38ba8;
      border-left: 3px solid #f38ba8;
    }
    .status.info {
      display: block;
      color: #89b4fa;
      border-left: 3px solid #89b4fa;
    }
    .btn-row {
      display: flex;
      gap: 8px;
    }
    .btn-row .btn {
      flex: 1;
    }
    .empty-state {
      text-align: center;
      padding: 20px 0;
      color: #6c7086;
    }
    .empty-state .icon {
      font-size: 32px;
      margin-bottom: 8px;
    }
  </style>
</head>
<body>
  <h2>🔑 Token Extractor</h2>
  
  <div id="content">
    <div class="provider-group">
      <label class="provider-label">Provider</label>
      <select id="providerSelect">
        <option value="">Loading...</option>
      </select>
    </div>
    
    <div class="provider-group token-display">
      <label class="provider-label">Bearer Token</label>
      <input type="text" id="tokenInput" readonly placeholder="Select a provider to view token" />
    </div>
    
    <div class="btn-row">
      <button class="btn" id="copyBtn">📋 Copy</button>
      <button class="btn btn-secondary" id="refreshBtn">🔄 Refresh</button>
    </div>
    
    <div id="status" class="status"></div>
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
